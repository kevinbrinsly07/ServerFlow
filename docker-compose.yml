services:
  postgres:
    image: postgres:17
    container_name: serveflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: serveflow
      POSTGRES_USER: serveflow
      POSTGRES_PASSWORD: local_dev_passsword
    ports:
      - "5433:5432"
    volumes:
      - serveflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serveflow -d serveflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  serveflow_data:
